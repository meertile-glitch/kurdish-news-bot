name: Kurdish AI News
on:
  schedule:
    - cron: '0 */3 * * *' # هەر 3 کاتژمێر جارێک
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Kurdish Fonts + RAQM
        run: |
          sudo apt-get update && sudo apt-get install -y libraqm0 fonts-noto
          pip install Vazirmatn

      - name: Install deps
        run: |
          pip install -r requirements.txt
          # requirements.txt دەبێت ئەمانەی تێدابێت:
          # feedparser requests python-telegram-bot Pillow arabic-reshaper python-bidi deep-translator

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python main.py

      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@ai.news.krd"
          git add sent.txt || true
          git diff --staged --quiet || git commit -m "update sent history"
          git push || echo "nothing to push"
