name: Kurdish AI News Bot
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run AI News Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_ID: ${{ secrets.FB_ID }}
        run: python bot.py
      - name: Save history
        run: |
          git config --local user.email "bot@ai.com"
          git config --local user.name "AI Bot"
          git add -A || true
          git commit -m "update history" || true
          git push || true
