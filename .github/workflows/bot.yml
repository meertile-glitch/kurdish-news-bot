name: Kurdish AI News - Telegram + Facebook Page

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Kurdish Fonts + RAQM
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b 2>/dev/null || true
          sudo apt-get install -y fonts-noto-core fonts-noto fonts-noto-naskh-arabic fonts-noto-kufi-arabic fonts-noto-cjk fonts-dejavu-core 2>/dev/null || true
          fc-cache -fv
          echo "=== template check ==="
          ls -lh template_base.jpg || echo "No template file - will use CODE background (beautiful tech design)"
          echo "=== fonts ==="
          fc-list :lang=ar | head -3
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall Pillow
          python -c "from PIL import features; print('RAQM:', features.check('raqm'), 'HarfBuzz:', features.check('harfbuzz'))"
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_ID: ${{ secrets.FB_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
      - name: Save sent history
        run: |
          git config --local user.email "bot@kurdish-ai.com"
          git config --local user.name "Kurdish AI Bot"
          git add sent.txt || true
          git commit -m "Update sent $(date -u)" || true
          git pull --rebase origin main || true
          git push origin main || true
