name: Kurdish AI News - Telegram + Facebook

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Kurdish Fonts + RAQM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b fonts-noto-core fonts-noto fonts-noto-naskh-arabic fonts-noto-kufi-arabic fonts-dejavu-core -qq 2>/dev/null || true
          mkdir -p /tmp/fonts
          cd /tmp/fonts
          wget -q https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-fonts.zip -O vazir.zip || true
          unzip -o vazir.zip "*.ttf" -d . 2>/dev/null || true
          sudo mkdir -p /usr/share/fonts/truetype/noto/
          sudo cp /tmp/fonts/*.ttf /usr/share/fonts/truetype/noto/ 2>/dev/null || true
          sudo cp /tmp/fonts/Vazirmatn/*.ttf /usr/share/fonts/truetype/noto/ 2>/dev/null || true
          fc-cache -fv > /dev/null

      - name: Install deps
        run: |
          pip install -r requirements.txt -q
          pip install --upgrade --force-reinstall Pillow -q
          python -c "from PIL import features; print('RAQM:', features.check('raqm')); print('HarfBuzz:', features.check('harfbuzz'))"

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_ID: ${{ secrets.FB_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python bot.py

      - name: Save history
        if: always()
        run: |
          git config --local user.email "bot@kurdish-ai.com"
          git config --local user.name "Kurdish AI Bot"
          git add sent.txt || true
          git commit -m "Update sent $(date -u)" || true
          git pull --rebase origin main || true
          git push || true
