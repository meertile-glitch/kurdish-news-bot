name: Kurdish AI News - Telegram + Facebook

on:
  schedule:
    - cron: '*/15 * * * *'  # هەموو ۱۵ خولەک جارێک دەیپشکنێت
  workflow_dispatch:        # بۆ ڕانکردنی دەستی لە GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          META_LLAMA_API_KEY: ${{ secrets.META_LLAMA_API_KEY }}
        run: |
          echo "Checking secrets..."
          if [ -z "$BOT_TOKEN" ]; then echo "❌ BOT_TOKEN missing"; else echo "✅ BOT_TOKEN set"; fi
          if [ -z "$CHANNEL_ID" ]; then echo "❌ CHANNEL_ID missing"; else echo "✅ CHANNEL_ID set"; fi
          if [ -z "$META_LLAMA_API_KEY" ]; then echo "❌ META_LLAMA_API_KEY missing"; else echo "✅ META_LLAMA_API_KEY set"; fi
          python bot.py

      - name: Save History (sent.txt)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add sent.txt || true
          git commit -m "Update sent.txt history [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
